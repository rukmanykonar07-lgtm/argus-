<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARGUS Pulse — Agency Ad Command Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121110; --sidebar: #17150f; --panel: #1b1914; --panel-2: #221f18;
    --line: #33301f; --amber: #e8a13c; --amber-dim: #8a6224;
    --green: #6fcf97; --red: #e57373; --blue: #6fa8dc;
    --text: #f2efe6; --text-dim: #93897a;
    --meta: #4f8ef7; --google: #f4b942; --tiktok: #f0507a;
    --display: 'Sora', sans-serif; --mono: 'IBM Plex Mono', monospace; --body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 250px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; }
  .sidebar-head { padding: 20px 18px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .brand span { color: var(--amber); }
  .brand-sub { font-family: var(--mono); font-size: 9px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.04em; }
  .client-nav { flex: 1; overflow-y: auto; padding: 10px; }
  .client-nav-label { font-family: var(--mono); font-size: 9.5px; color: var(--text-dim); letter-spacing: 0.08em; padding: 8px 10px 6px; text-transform: uppercase; }
  .client-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 11px; border-radius: 7px; cursor: pointer; margin-bottom: 2px; font-size: 13px; font-weight: 500; }
  .client-item:hover { background: var(--panel-2); }
  .client-item.active { background: var(--panel-2); color: var(--amber); }
  .client-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 8px; flex-shrink: 0; display: inline-block; }
  .client-item .dot.paused { background: var(--text-dim); }
  .ci-left { display: flex; align-items: center; overflow: hidden; }
  .ci-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ci-count { font-family: var(--mono); font-size: 9.5px; color: var(--text-dim); flex-shrink: 0; }
  .sidebar-foot { padding: 14px; border-top: 1px solid var(--line); }
  .add-client-btn { width: 100%; background: var(--amber); color: #1c1500; border: none; font-weight: 600; font-size: 13px; padding: 10px; border-radius: 7px; cursor: pointer; }
  .add-client-btn:hover { background: #f0b458; }
  .main { flex: 1; min-width: 0; padding: 26px 34px 60px; }
  .portfolio-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
  .portfolio-title { font-family: var(--display); font-size: 23px; font-weight: 700; }
  .portfolio-sub { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 13px; }
  .portfolio-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 17px; cursor: pointer; transition: border-color 0.15s; }
  .portfolio-card:hover { border-color: var(--amber-dim); }
  .pc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 13px; }
  .pc-name { font-family: var(--display); font-weight: 600; font-size: 14.5px; }
  .mode-badge { font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.05em; padding: 3px 6px; border-radius: 4px; text-transform: uppercase; }
  .mode-badge.live { background: rgba(111,207,151,0.12); color: var(--green); border: 1px solid rgba(111,207,151,0.3); }
  .mode-badge.demo { background: rgba(146,140,126,0.12); color: var(--text-dim); border: 1px solid var(--line); }
  .pc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .pc-stat-label { font-family: var(--mono); font-size: 9px; color: var(--text-dim); text-transform: uppercase; }
  .pc-stat-val { font-family: var(--display); font-size: 15px; font-weight: 700; margin-top: 2px; }
  .back-link { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); cursor: pointer; margin-bottom: 10px; display: inline-block; }
  .back-link:hover { color: var(--amber); }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .client-title-row { display: flex; align-items: center; gap: 9px; }
  .client-title { font-family: var(--display); font-size: 22px; font-weight: 700; }
  .client-title-meta { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .top-actions { display: flex; gap: 7px; align-items: center; }
  .sync-btn, .manage-btn { font-family: var(--mono); font-size: 11px; background: transparent; border: 1px solid var(--line); color: var(--text-dim); padding: 7px 13px; border-radius: 6px; cursor: pointer; }
  .sync-btn:hover, .manage-btn:hover { border-color: var(--amber); color: var(--amber); }
  .controls-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .platform-tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .ptab { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); padding: 6px 12px; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
  .ptab.active { background: var(--panel-2); color: var(--amber); }
  .range-row { display: flex; gap: 5px; }
  .range-btn { font-family: var(--mono); font-size: 10.5px; background: var(--panel); border: 1px solid var(--line); color: var(--text-dim); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .range-btn.active { border-color: var(--amber); color: var(--amber); }
  .accounts-strip { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
  .account-pill { font-family: var(--mono); font-size: 10px; color: var(--text-dim); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px; }
  .account-pill .plat-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .account-pill .never { color: var(--red); }
  .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
  .kpi-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 15px; }
  .kpi-label { font-family: var(--mono); font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .kpi-value-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
  .kpi-value { font-family: var(--display); font-size: 18px; font-weight: 700; }
  .kpi-delta { font-family: var(--mono); font-size: 10px; }
  .kpi-delta.up { color: var(--green); }
  .kpi-delta.down { color: var(--red); }
  .sparkline { display: block; }
  .analytics-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 20px; }
  .panel-block { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .panel-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .panel-title { font-family: var(--display); font-size: 12.5px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .chart-toggle { display: flex; gap: 3px; }
  .ctoggle-btn { font-family: var(--mono); font-size: 9.5px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim); padding: 4px 9px; border-radius: 5px; cursor: pointer; }
  .ctoggle-btn.active { color: var(--amber); border-color: var(--amber-dim); }
  canvas { max-height: 220px; }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .legend-row { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 11px; }
  .legend-left { display: flex; align-items: center; gap: 7px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend-val { color: var(--text-dim); }
  .insights-panel { margin-bottom: 20px; }
  .insight-card { display: flex; gap: 12px; padding: 14px 16px; border-radius: 9px; margin-bottom: 8px; border: 1px solid var(--line); background: var(--panel-2); }
  .insight-card.concern { border-left: 3px solid var(--red); }
  .insight-card.good { border-left: 3px solid var(--green); }
  .insight-card.neutral { border-left: 3px solid var(--amber); }
  .insight-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .insight-title { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
  .insight-explanation { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; }
  .insight-confidence { font-family: var(--mono); font-size: 9px; text-transform: uppercase; color: var(--text-dim); background: var(--panel); border: 1px solid var(--line); padding: 2px 7px; border-radius: 4px; display: inline-block; margin-top: 8px; }
  .no-insights { font-family: var(--mono); font-size: 12px; color: var(--text-dim); text-align: center; padding: 20px; }
  .table-controls { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .search-input { font-family: var(--body); font-size: 12.5px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 6px; flex: 1; min-width: 160px; }
  .status-select { font-family: var(--mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim); padding: 8px 10px; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-family: var(--mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 9px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
  th:hover { color: var(--amber); }
  td { padding: 10px 9px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  .plat-badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; color: var(--text-dim); }
  .plat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .status-badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; }
  .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-badge.active .dot { background: var(--green); }
  .status-badge.active { color: var(--green); }
  .status-badge.paused .dot { background: var(--text-dim); }
  .status-badge.paused { color: var(--text-dim); }
  .num-cell { font-family: var(--mono); text-align: right; }
  .campaign-name-cell { font-weight: 500; }
  .empty-state { text-align: center; padding: 70px 20px; color: var(--text-dim); font-family: var(--mono); font-size: 13px; }
  .empty-state .big { font-family: var(--display); font-size: 17px; color: var(--text); margin-bottom: 8px; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 10; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; width: 360px; }
  .modal h3 { font-family: var(--display); font-size: 16px; margin-bottom: 16px; }
  .modal-hint { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); margin: -6px 0 12px; line-height: 1.5; }
  .modal input, .modal textarea, .modal select { width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 6px; font-family: var(--body); font-size: 13px; margin-bottom: 10px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .modal-actions button { font-family: var(--body); font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; }
  .btn-cancel { background: transparent; color: var(--text-dim); }
  .btn-save { background: var(--amber); color: #1c1500; }
  .syncing-overlay { text-align: center; padding: 60px; font-family: var(--mono); color: var(--amber); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-head" onclick="showPortfolio()">
      <div class="brand">ARGUS <span>PULSE</span></div>
      <div class="brand-sub">AD PERFORMANCE COMMAND CENTER</div>
    </div>
    <div class="client-nav">
      <div class="client-nav-label">Clients</div>
      <div id="client-nav-list"></div>
    </div>
    <div class="sidebar-foot">
      <button class="add-client-btn" onclick="openClientModal()">+ Add Client</button>
    </div>
  </div>
  <div class="main" id="main-content"></div>
</div>

<div class="modal-overlay" id="client-modal-overlay">
  <div class="modal">
    <h3>Add Client</h3>
    <input type="text" id="new-client-name" placeholder="Client / brand name">
    <textarea id="new-client-notes" placeholder="Notes (contact, retainer, next action…)" rows="3"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeClientModal()">Cancel</button>
      <button class="btn-save" onclick="saveClient()">Add</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="account-modal-overlay">
  <div class="modal">
    <h3>Add Ad Account</h3>
    <select id="new-account-platform">
      <option value="meta">Meta (Facebook/Instagram)</option>
      <option value="google">Google Ads</option>
      <option value="tiktok">TikTok Ads</option>
    </select>
    <input type="text" id="new-account-id" placeholder="Account ID (leave blank for demo data)">
    <input type="text" id="new-account-label" placeholder="Label e.g. Main account">
    <input type="text" id="new-account-token" placeholder="Access token (optional — real data)">
    <div class="modal-hint">Leave Account ID + Token empty → demo data. Fill both → pulls real numbers.</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAccountModal()">Cancel</button>
      <button class="btn-save" onclick="saveAccount()">Add</button>
    </div>
  </div>
</div>

<script>
  let clients = [];
  let activeClientId = null;
  let trendChart = null, donutChart = null;
  let sortKey = 'spend', sortDir = -1;
  let currentRange = 30;
  let activePlatformTab = 'all';
  let trendMetricPair = 'spend_revenue';
  const PLATFORM_COLORS = { meta: '#4f8ef7', google: '#f4b942', tiktok: '#f0507a' };

  function fmtMoney(n) {
    if (n === null || n === undefined) return '—';
    const abs = Math.abs(n);
    if (abs >= 1e7) return '₹' + (n / 1e7).toFixed(2) + 'Cr';
    if (abs >= 1e5) return '₹' + (n / 1e5).toFixed(2) + 'L';
    if (abs >= 1e3) return '₹' + (n / 1e3).toFixed(1) + 'K';
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }
  function fmtNum(n) {
    if (n === null || n === undefined) return '—';
    const abs = Math.abs(n);
    if (abs >= 1e7) return (n / 1e7).toFixed(2) + 'Cr';
    if (abs >= 1e5) return (n / 1e5).toFixed(2) + 'L';
    if (abs >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return Math.round(n).toLocaleString('en-IN');
  }
  function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
  function timeAgo(iso) {
    if (!iso) return 'never synced';
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 1) return 'synced just now';
    if (mins < 60) return `synced ${mins}m ago`;
    if (mins < 1440) return `synced ${Math.round(mins / 60)}h ago`;
    return `synced ${Math.round(mins / 1440)}d ago`;
  }
  function deltaHtml(pct) {
    if (pct === null || pct === undefined || !isFinite(pct)) return '';
    const dir = pct >= 0 ? 'up' : 'down';
    const arrow = pct >= 0 ? '▲' : '▼';
    return `<span class="kpi-delta ${dir}">${arrow} ${Math.abs(pct).toFixed(1)}%</span>`;
  }
  function sparklineSvg(values, color) {
    if (!values || values.length < 2) return '';
    const w = 100, h = 30, pad = 2;
    const max = Math.max(...values), min = Math.min(...values);
    const range = (max - min) || 1;
    const pts = values.map((v, i) => {
      const x = (i / (values.length - 1)) * (w - pad * 2) + pad;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg class="sparkline" width="100%" height="30" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  function platDot(platform) { return `<span class="plat-dot" style="background:${PLATFORM_COLORS[platform] || '#888'}"></span>`; }

  async function loadClients() {
    clients = await (await fetch('/api/clients')).json();
    renderSidebar();
  }

  function renderSidebar() {
    const list = document.getElementById('client-nav-list');
    if (!clients.length) {
      list.innerHTML = '<div style="padding:10px;font-family:var(--mono);font-size:11px;color:var(--text-dim);">No clients yet</div>';
      return;
    }
    list.innerHTML = clients.map(c => `
      <div class="client-item ${c.id === activeClientId ? 'active' : ''}" onclick="selectClient(${c.id})">
        <div class="ci-left"><span class="dot ${c.status !== 'active' ? 'paused' : ''}"></span><span class="ci-name">${escapeHtml(c.name)}</span></div>
        <span class="ci-count">${c.ad_accounts.length}</span>
      </div>
    `).join('');
  }

  async function showPortfolio() {
    activeClientId = null;
    renderSidebar();
    const main = document.getElementById('main-content');
    main.innerHTML = `<div class="syncing-overlay">LOADING PORTFOLIO…</div>`;
    const portfolio = await (await fetch(`/api/portfolio?days=${currentRange}`)).json();
    if (!portfolio.length) {
      main.innerHTML = `<div class="empty-state"><div class="big">No clients yet</div>Add your first client from the sidebar to start tracking ad performance.</div>`;
      return;
    }
    main.innerHTML = `
      <div class="portfolio-head"><div><div class="portfolio-title">Portfolio</div><div class="portfolio-sub">${portfolio.length} client${portfolio.length === 1 ? '' : 's'} · last ${currentRange} days</div></div></div>
      <div class="portfolio-grid">
        ${portfolio.map(c => `
          <div class="portfolio-card" onclick="selectClient(${c.id})">
            <div class="pc-top"><div class="pc-name">${escapeHtml(c.name)}</div><span class="mode-badge ${c.is_live ? 'live' : 'demo'}">${c.is_live ? 'Live' : 'Demo'}</span></div>
            <div class="pc-stats">
              <div><div class="pc-stat-label">Spend</div><div class="pc-stat-val">${fmtMoney(c.totals.spend)}</div></div>
              <div><div class="pc-stat-label">ROAS</div><div class="pc-stat-val">${c.totals.roas ? c.totals.roas.toFixed(1) + 'x' : '—'}</div></div>
              <div><div class="pc-stat-label">Clicks</div><div class="pc-stat-val">${fmtNum(c.totals.clicks)}</div></div>
              <div><div class="pc-stat-label">Accounts</div><div class="pc-stat-val">${c.account_count}</div></div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  async function selectClient(id) {
    activeClientId = id;
    activePlatformTab = 'all';
    renderSidebar();
    const main = document.getElementById('main-content');
    main.innerHTML = `<div class="syncing-overlay">LOADING…</div>`;
    const client = clients.find(c => c.id === id);
    const [summary, insights] = await Promise.all([
      fetch(`/api/clients/${id}/summary?days=${currentRange}`).then(r => r.json()),
      fetch(`/api/clients/${id}/insights?days=${currentRange}`).then(r => r.json()),
    ]);
    renderClientDetail(client, summary, insights);
  }

  function renderClientDetail(client, summary, insights) {
    window._summary = summary;
    window._insights = insights;
    window._client = client;
    const main = document.getElementById('main-content');
    const isLive = summary.accounts.some(a => a.connected);
    const platformsPresent = [...new Set(summary.accounts.map(a => a.platform))];

    main.innerHTML = `
      <span class="back-link" onclick="showPortfolio()">← Portfolio</span>
      <div class="top-row">
        <div>
          <div class="client-title-row"><div class="client-title">${escapeHtml(client.name)}</div><span class="mode-badge ${isLive ? 'live' : 'demo'}">${isLive ? 'Live' : 'Demo'}</span></div>
          <div class="client-title-meta">${client.notes ? escapeHtml(client.notes) : 'No notes yet'}</div>
        </div>
        <div class="top-actions">
          <button class="manage-btn" onclick="openAccountModal(${client.id})">+ Ad Account</button>
          <button class="sync-btn" onclick="syncAllAccounts(${client.id})">↻ Sync All</button>
        </div>
      </div>
      <div class="controls-row">
        <div class="platform-tabs">
          <div class="ptab ${activePlatformTab === 'all' ? 'active' : ''}" onclick="setPlatformTab('all')">All</div>
          ${platformsPresent.map(p => `<div class="ptab ${activePlatformTab === p ? 'active' : ''}" onclick="setPlatformTab('${p}')">${p}</div>`).join('')}
        </div>
        <div class="range-row">
          ${[7, 14, 30, 90].map(r => `<button class="range-btn ${r === currentRange ? 'active' : ''}" onclick="setRange(${r})">${r}D</button>`).join('')}
        </div>
      </div>
      <div class="accounts-strip">
        ${summary.accounts.length ? summary.accounts.map(a => `
          <div class="account-pill">${platDot(a.platform)}${escapeHtml(a.label)} · ${a.connected ? '<span style="color:var(--green)">live</span>' : '<span>demo</span>'} · ${a.last_synced_at ? timeAgo(a.last_synced_at) : '<span class="never">never synced</span>'}</div>
        `).join('') : '<div class="account-pill">No ad accounts connected yet</div>'}
      </div>
      <div class="kpi-grid" id="kpi-grid"></div>
      <div class="insights-panel">
        <div class="panel-block">
          <div class="panel-title-row"><div class="panel-title">Why performance moved</div></div>
          <div id="insights-list"></div>
        </div>
      </div>
      <div class="analytics-grid">
        <div class="panel-block">
          <div class="panel-title-row">
            <div class="panel-title">Trend</div>
            <div class="chart-toggle">
              <div class="ctoggle-btn ${trendMetricPair === 'spend_revenue' ? 'active' : ''}" onclick="setTrendPair('spend_revenue')">Spend / Revenue</div>
              <div class="ctoggle-btn ${trendMetricPair === 'clicks_conversions' ? 'active' : ''}" onclick="setTrendPair('clicks_conversions')">Clicks / Conv.</div>
            </div>
          </div>
          <canvas id="trend-chart"></canvas>
        </div>
        <div class="panel-block">
          <div class="panel-title-row"><div class="panel-title">Spend by Platform</div></div>
          <canvas id="donut-chart"></canvas>
          <div class="donut-legend" id="donut-legend"></div>
        </div>
      </div>
      <div class="panel-block">
        <div class="panel-title-row"><div class="panel-title">Campaign Performance</div></div>
        <div class="table-controls">
          <input type="text" class="search-input" id="campaign-search" placeholder="Search campaigns…" oninput="renderCampaignTable()">
          <select class="status-select" id="status-filter" onchange="renderCampaignTable()">
            <option value="all">All statuses</option>
            <option value="active">Active only</option>
            <option value="paused">Paused only</option>
          </select>
        </div>
        <table>
          <thead>
            <tr>
              <th onclick="sortTable('status')">Status</th>
              <th onclick="sortTable('campaign_name')">Campaign</th>
              <th onclick="sortTable('platform')">Platform</th>
              <th class="num-cell" onclick="sortTable('spend')">Spend</th>
              <th class="num-cell" onclick="sortTable('impressions')">Impr.</th>
              <th class="num-cell" onclick="sortTable('clicks')">Clicks</th>
              <th class="num-cell" onclick="sortTable('ctr')">CTR</th>
              <th class="num-cell" onclick="sortTable('conversions')">Conv.</th>
              <th class="num-cell" onclick="sortTable('cpa')">CPA</th>
              <th class="num-cell" onclick="sortTable('roas')">ROAS</th>
            </tr>
          </thead>
          <tbody id="campaign-tbody"></tbody>
        </table>
      </div>
    `;
    renderKpiCards();
    renderInsights();
    renderCampaignTable();
    renderTrendChart();
    renderDonutChart();
  }

  function setPlatformTab(p) { activePlatformTab = p; renderCampaignTable(); }

  function renderKpiCards() {
    const t = window._summary.totals;
    const d = window._summary.deltas;
    const ts = window._summary.timeseries;
    const spark = key => sparklineSvg(ts.map(r => r[key]), '#e8a13c');
    const cards = [
      { label: 'Spend', val: fmtMoney(t.spend), delta: d.spend, key: 'spend' },
      { label: 'Revenue', val: fmtMoney(t.revenue), delta: d.revenue, key: 'revenue' },
      { label: 'ROAS', val: t.roas ? t.roas.toFixed(2) + 'x' : '—', delta: d.roas, key: 'roas' },
      { label: 'CTR', val: t.ctr.toFixed(2) + '%', delta: d.ctr, key: 'ctr' },
      { label: 'CPA', val: t.cpa ? fmtMoney(t.cpa) : '—', delta: d.cpa, key: 'cpa' },
      { label: 'Conversions', val: fmtNum(t.conversions), delta: null, key: 'conversions' },
    ];
    document.getElementById('kpi-grid').innerHTML = cards.map(c => `
      <div class="kpi-card">
        <div class="kpi-label">${c.label}</div>
        <div class="kpi-value-row"><div class="kpi-value">${c.val}</div>${deltaHtml(c.delta)}</div>
        ${spark(c.key)}
      </div>
    `).join('');
  }

  const SEVERITY_ICON = { concern: '⚠', good: '✓', neutral: 'ℹ' };
  function renderInsights() {
    const list = document.getElementById('insights-list');
    const insights = window._insights;
    if (!insights.length) {
      list.innerHTML = `<div class="no-insights">No notable shifts this period — performance is steady across campaigns.</div>`;
      return;
    }
    list.innerHTML = insights.map(i => `
      <div class="insight-card ${i.severity}">
        <div class="insight-icon">${SEVERITY_ICON[i.severity]}</div>
        <div>
          <div class="insight-title">${escapeHtml(i.title)}</div>
          <div class="insight-explanation">${escapeHtml(i.explanation)}</div>
          <div class="insight-confidence">${escapeHtml(i.confidence)}</div>
        </div>
      </div>
    `).join('');
  }

  function sortTable(key) {
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
    renderCampaignTable();
  }

  function renderCampaignTable() {
    const search = (document.getElementById('campaign-search')?.value || '').toLowerCase();
    const statusFilter = document.getElementById('status-filter')?.value || 'all';
    let rows = [...window._summary.campaigns];
    if (activePlatformTab !== 'all') rows = rows.filter(c => c.platform === activePlatformTab);
    if (statusFilter !== 'all') rows = rows.filter(c => c.status === statusFilter);
    if (search) rows = rows.filter(c => c.campaign_name.toLowerCase().includes(search));
    rows.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (typeof av === 'string') return sortDir * av.localeCompare(bv);
      return sortDir * ((av ?? -Infinity) - (bv ?? -Infinity));
    });
    const tbody = document.getElementById('campaign-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--text-dim);font-family:var(--mono);padding:30px;">No campaigns match</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(c => `
      <tr>
        <td><span class="status-badge ${c.status}"><span class="dot"></span>${c.status}</span></td>
        <td class="campaign-name-cell">${escapeHtml(c.campaign_name)}</td>
        <td><span class="plat-badge">${platDot(c.platform)}${c.platform}</span></td>
        <td class="num-cell">${fmtMoney(c.spend)}</td>
        <td class="num-cell">${fmtNum(c.impressions)}</td>
        <td class="num-cell">${fmtNum(c.clicks)}</td>
        <td class="num-cell">${c.ctr.toFixed(2)}%</td>
        <td class="num-cell">${fmtNum(c.conversions)}</td>
        <td class="num-cell">${c.cpa ? fmtMoney(c.cpa) : '—'}</td>
        <td class="num-cell">${c.roas ? c.roas.toFixed(2) + 'x' : '—'}</td>
      </tr>
    `).join('');
  }

  function setTrendPair(pair) { trendMetricPair = pair; renderClientDetail(window._client, window._summary, window._insights); }

  function renderTrendChart() {
    const ts = window._summary.timeseries;
    const ctx = document.getElementById('trend-chart');
    if (trendChart) trendChart.destroy();
    const pairs = trendMetricPair === 'spend_revenue'
      ? [{ k: 'spend', label: 'Spend', color: '#e8a13c' }, { k: 'revenue', label: 'Revenue', color: '#6fcf97' }]
      : [{ k: 'clicks', label: 'Clicks', color: '#6fa8dc' }, { k: 'conversions', label: 'Conversions', color: '#e8a13c' }];
    trendChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ts.map(t => t.date),
        datasets: pairs.map((p, i) => ({
          label: p.label, data: ts.map(t => t[p.k]), borderColor: p.color,
          backgroundColor: i === 0 ? p.color + '15' : 'transparent', fill: i === 0, tension: 0.3, yAxisID: i === 0 ? 'y' : 'y1',
        })),
      },
      options: {
        responsive: true, interaction: { mode: 'index', intersect: false },
        scales: {
          x: { ticks: { color: '#93897a', maxTicksLimit: 10 }, grid: { color: '#33301f' } },
          y: { position: 'left', ticks: { color: '#93897a' }, grid: { color: '#33301f' } },
          y1: { position: 'right', ticks: { color: '#93897a' }, grid: { display: false } },
        },
        plugins: { legend: { labels: { color: '#f2efe6', font: { family: 'Inter' } } } },
      },
    });
  }

  function renderDonutChart() {
    const spend = window._summary.platformSpend;
    const labels = Object.keys(spend);
    const values = Object.values(spend);
    const colors = labels.map(l => PLATFORM_COLORS[l] || '#888');
    const ctx = document.getElementById('donut-chart');
    if (donutChart) donutChart.destroy();
    if (!labels.length) {
      document.getElementById('donut-legend').innerHTML = `<div style="font-family:var(--mono);font-size:11px;color:var(--text-dim);text-align:center;">No spend data yet</div>`;
      return;
    }
    donutChart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data: values, backgroundColor: colors, borderColor: '#1b1914', borderWidth: 2 }] },
      options: { plugins: { legend: { display: false } }, cutout: '68%' },
    });
    const total = values.reduce((a, b) => a + b, 0);
    document.getElementById('donut-legend').innerHTML = labels.map((l, i) => `
      <div class="legend-row"><div class="legend-left"><span class="legend-dot" style="background:${colors[i]}"></span>${l}</div><div class="legend-val">${fmtMoney(values[i])} · ${((values[i] / total) * 100).toFixed(0)}%</div></div>
    `).join('');
  }

  function setRange(days) {
    currentRange = days;
    if (activeClientId) selectClient(activeClientId); else showPortfolio();
  }

  async function syncAllAccounts(clientId) {
    const fresh = await (await fetch('/api/clients')).json();
    const client = fresh.find(c => c.id === clientId);
    for (const a of client.ad_accounts) await fetch(`/api/ad-accounts/${a.id}/sync`, { method: 'POST' });
    await loadClients();
    if (activeClientId === clientId) selectClient(clientId);
  }

  function openClientModal() { document.getElementById('client-modal-overlay').classList.add('open'); }
  function closeClientModal() { document.getElementById('client-modal-overlay').classList.remove('open'); }

  async function saveClient() {
    const name = document.getElementById('new-client-name').value.trim();
    const notes = document.getElementById('new-client-notes').value.trim();
    if (!name) return;
    const res = await (await fetch('/api/clients', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, notes }) })).json();
    document.getElementById('new-client-name').value = '';
    document.getElementById('new-client-notes').value = '';
    closeClientModal();
    await loadClients();
    selectClient(res.id);
  }

  let accountModalClientId = null;
  function openAccountModal(clientId) { accountModalClientId = clientId; document.getElementById('account-modal-overlay').classList.add('open'); }
  function closeAccountModal() { document.getElementById('account-modal-overlay').classList.remove('open'); }

  async function saveAccount() {
    const platform = document.getElementById('new-account-platform').value;
    const acctId = document.getElementById('new-account-id').value.trim() || `demo_${Date.now()}`;
    const label = document.getElementById('new-account-label').value.trim() || acctId;
    const token = document.getElementById('new-account-token').value.trim();
    const res = await (await fetch(`/api/clients/${accountModalClientId}/ad-accounts`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ platform, external_account_id: acctId, label, access_token: token || undefined }),
    })).json();
    document.getElementById('new-account-id').value = '';
    document.getElementById('new-account-label').value = '';
    document.getElementById('new-account-token').value = '';
    closeAccountModal();
    await fetch(`/api/ad-accounts/${res.id}/sync`, { method: 'POST' });
    await loadClients();
    selectClient(accountModalClientId);
  }

  loadClients().then(showPortfolio);
</script>
</body>
</html>
